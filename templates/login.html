
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Plant Care Reminder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">

    <nav class="navbar">
        <a class="brand" href="{{ url_for('home') }}">
            <span class="brand-icon">♧<
                /span>
            <span>Plant Care Reminder</span>
        </a>

        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('home') }}#features">Features</a>
            <a href="{{ url_for('home') }}#about">About</a>
        </div>

        <div class="nav-actions">
            <a class="login-link" href="{{ url_for('login') }}">Login</a>
            <a class="nav-button" href="{{ url_for('register') }}">Get Started</a>
        </div>
    </nav>

    <main class="auth-main">
        <section class="auth-card">

            <div class="auth-icon">⚿</div>

            <h1>Welcome Back</h1>
            <p class="auth-subtitle">
                Log in to check on your plants today
            </p>

            {% if error %}
                <p class="auth-error">{{ error }}</p>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="password-heading">
                    <label for="password">Password</label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <div class="form-group">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="auth-submit">
                    Log In
                </button>

            </form>

            <p class="auth-signup">
                Don't have an account?
                <a href="{{ url_for('register') }}">Sign Up</a>
            </p>

            <div class="auth-footer">
                <span>ⓘ</span>
                Thriving beautifully since login
            </div>

        </section>
    </main>

</body>
</html>
