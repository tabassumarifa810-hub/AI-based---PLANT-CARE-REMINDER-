
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a Plant - PlantCare</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>🌱 Add a New Plant</h1>

    <form method="POST" action="{{ url_for('add_plant') }}">
        <label for="plant_name">Plant Name:</label>
        <input type="text" id="plant_name" name="plant_name" required>
        <br><br>

        <label for="species">Species:</label>
        <input type="text" id="species" name="species">
        <br><br>

        <label for="watering_interval">Water every (days):</label>
        <input type="number" id="watering_interval"
               name="watering_interval" min="1" value="7" required>
        <br><br>

        <label for="last_watered">Last Watered:</label>
        <input type="date" id="last_watered" name="last_watered">
        <br><br>

        <button type="submit">Save Plant</button>
    </form>

    <p><a href="{{ url_for('dashboard') }}">Back to Dashboard</a></p>
</body>
</html>
